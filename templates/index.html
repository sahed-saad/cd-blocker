<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ AI CD Blocker - Live Stream Protection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }
        
        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .status-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #28a745;
        }
        
        .status-item.warning {
            border-left-color: #ffc107;
        }
        
        .status-item.error {
            border-left-color: #dc3545;
        }
        
        .video-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .video-box {
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        
        .video-box h3 {
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            margin: 0;
            text-align: center;
        }
        
        .video-box img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        
        .controls {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .control-group input[type="range"] {
            width: 100%;
            margin-bottom: 10px;
        }
        
        .control-group input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 2px dashed #ddd;
            border-radius: 5px;
            background: #f8f9fa;
        }
        
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        .btn:hover {
            background: #0056b3;
        }
        
        .btn.success {
            background: #28a745;
        }
        
        .btn.warning {
            background: #ffc107;
            color: #333;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #007bff;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .video-container {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ AI CD Blocker</h1>
            <p>Real-time credit card detection and blurring for live streamers</p>
        </div>
        
        <div class="status-card">
            <h2>System Status</h2>
            <div class="status-grid">
                <div class="status-item" id="gemini-status">
                    <h3>Google Gemini AI</h3>
                    <p id="gemini-text">Checking...</p>
                </div>
                <div class="status-item" id="backend-status">
                    <h3>Backend Processing</h3>
                    <p>✅ YOLOv8 Loaded</p>
                </div>
                <div class="status-item" id="latency-status">
                    <h3>Processing Latency</h3>
                    <p id="latency-text">Ready</p>
                </div>
            </div>
        </div>
        
        <div class="video-container">
            <div class="video-box">
                <h3>Original Stream</h3>
                <img id="original-video" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZGRkIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzk5OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPk5vIHZpZGVvIGZlZWQ8L3RleHQ+PC9zdmc+" alt="Original Video">
            </div>
            <div class="video-box">
                <h3>Protected Stream</h3>
                <img id="processed-video" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZGRkIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzk5OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPk5vIHZpZGVvIGZlZWQ8L3RleHQ+PC9zdmc+" alt="Processed Video">
            </div>
        </div>
        
        <div class="controls">
            <h2>Controls</h2>
            
            <div class="control-group">
                <label for="image-upload">Upload Test Image:</label>
                <input type="file" id="image-upload" accept="image/*">
            </div>
            
            <div class="control-group">
                <label for="blur-intensity">Blur Intensity: <span id="blur-value">15</span></label>
                <input type="range" id="blur-intensity" min="5" max="50" value="15">
            </div>
            
            <div class="control-group">
                <label for="confidence-threshold">Confidence Threshold: <span id="confidence-value">0.3</span></label>
                <input type="range" id="confidence-threshold" min="0.1" max="1.0" step="0.1" value="0.3">
            </div>
            
            <button class="btn" onclick="startWebcam()">Start Webcam</button>
            <button class="btn success" onclick="processImage()">Process Image</button>
            <button class="btn warning" onclick="stopWebcam()">Stop Webcam</button>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="detection-count">0</div>
                    <div class="stat-label">Detections</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="processing-time">0ms</div>
                    <div class="stat-label">Processing Time</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="fps">0</div>
                    <div class="stat-label">FPS</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let webcamStream = null;
        let isProcessing = false;
        let frameCount = 0;
        let lastTime = Date.now();
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            checkSystemStatus();
            setupEventListeners();
        });
        
        function setupEventListeners() {
            // Blur intensity slider
            document.getElementById('blur-intensity').addEventListener('input', function(e) {
                document.getElementById('blur-value').textContent = e.target.value;
                updateConfig();
            });
            
            // Confidence threshold slider
            document.getElementById('confidence-threshold').addEventListener('input', function(e) {
                document.getElementById('confidence-value').textContent = e.target.value;
                updateConfig();
            });
            
            // Image upload
            document.getElementById('image-upload').addEventListener('change', function(e) {
                if (e.target.files[0]) {
                    processUploadedImage(e.target.files[0]);
                }
            });
        }
        
        async function checkSystemStatus() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                
                // Update Gemini status
                const geminiStatus = document.getElementById('gemini-status');
                const geminiText = document.getElementById('gemini-text');
                if (data.gemini_available) {
                    geminiStatus.className = 'status-item';
                    geminiText.textContent = '✅ Connected';
                } else {
                    geminiStatus.className = 'status-item warning';
                    geminiText.textContent = '⚠️ Not Available (Fallback Mode)';
                }
                
                // Update backend status
                if (data.backend_loaded) {
                    document.getElementById('backend-status').className = 'status-item';
                }
                
            } catch (error) {
                console.error('Status check failed:', error);
                document.getElementById('gemini-status').className = 'status-item error';
                document.getElementById('gemini-text').textContent = '❌ Error';
            }
        }
        
        async function updateConfig() {
            const config = {
                blur_intensity: parseInt(document.getElementById('blur-intensity').value),
                confidence_threshold: parseFloat(document.getElementById('confidence-threshold').value)
            };
            
            try {
                await fetch('/api/config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(config)
                });
            } catch (error) {
                console.error('Config update failed:', error);
            }
        }
        
        async function processImage() {
            if (isProcessing) return;
            
            isProcessing = true;
            const button = event.target;
            const originalText = button.textContent;
            button.textContent = 'Processing...';
            button.disabled = true;
            
            try {
                // Get current webcam frame or use placeholder
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 640;
                canvas.height = 480;
                
                // Draw placeholder or webcam frame
                ctx.fillStyle = '#f0f0f0';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#333';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Test Image', canvas.width/2, canvas.height/2);
                
                const base64 = canvas.toDataURL('image/jpeg').split(',')[1];
                
                const response = await fetch('/api/process_frame', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ image: base64 })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    // Update processed video display
                    document.getElementById('processed-video').src = 'data:image/jpeg;base64,' + result.processed_image;
                    
                    // Update stats
                    updateStats(result.detection_info);
                } else {
                    alert('Processing failed: ' + result.error);
                }
                
            } catch (error) {
                console.error('Processing error:', error);
                alert('Processing failed: ' + error.message);
            } finally {
                isProcessing = false;
                button.textContent = originalText;
                button.disabled = false;
            }
        }
        
        function processUploadedImage(file) {
            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64 = e.target.result.split(',')[1];
                
                try {
                    const response = await fetch('/api/process_frame', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ image: base64 })
                    });
                    
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        // Update both displays
                        document.getElementById('original-video').src = 'data:image/jpeg;base64,' + base64;
                        document.getElementById('processed-video').src = 'data:image/jpeg;base64,' + result.processed_image;
                        
                        updateStats(result.detection_info);
                    }
                } catch (error) {
                    console.error('Upload processing failed:', error);
                }
            };
            reader.readAsDataURL(file);
        }
        
        function updateStats(detectionInfo) {
            document.getElementById('detection-count').textContent = detectionInfo.total_detections || 0;
            document.getElementById('processing-time').textContent = Math.round((detectionInfo.processing_time || 0) * 1000) + 'ms';
            
            // Update latency status
            const latencyStatus = document.getElementById('latency-status');
            const latencyText = document.getElementById('latency-text');
            if (detectionInfo.meets_latency_target) {
                latencyStatus.className = 'status-item';
                latencyText.textContent = '✅ < 300ms';
            } else {
                latencyStatus.className = 'status-item warning';
                latencyText.textContent = '⚠️ > 300ms';
            }
        }
        
        function startWebcam() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    webcamStream = stream;
                    const video = document.createElement('video');
                    video.srcObject = stream;
                    video.play();
                    
                    // Process frames
                    setInterval(() => {
                        if (webcamStream && !isProcessing) {
                            processWebcamFrame(video);
                        }
                    }, 100); // 10 FPS for demo
                })
                .catch(error => {
                    console.error('Webcam access failed:', error);
                    alert('Webcam access failed: ' + error.message);
                });
        }
        
        function stopWebcam() {
            if (webcamStream) {
                webcamStream.getTracks().forEach(track => track.stop());
                webcamStream = null;
            }
        }
        
        function processWebcamFrame(video) {
            if (isProcessing) return;
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            
            const base64 = canvas.toDataURL('image/jpeg').split(',')[1];
            
            // Process frame (simplified for demo)
            fetch('/api/process_frame', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ image: base64 })
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === 'success') {
                    document.getElementById('original-video').src = 'data:image/jpeg;base64,' + base64;
                    document.getElementById('processed-video').src = 'data:image/jpeg;base64,' + result.processed_image;
                    updateStats(result.detection_info);
                }
            })
            .catch(error => console.error('Webcam processing failed:', error));
        }
    </script>
</body>
</html>
